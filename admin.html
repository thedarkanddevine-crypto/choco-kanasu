<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choco Kanasu Admin</title>
<style>
body{margin:0;background:#120706;color:#f5e6d4;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:35px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1,h2{font-family:Georgia,serif}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:#21100d;border:1px solid #ffffff18;border-radius:18px;padding:20px}.num{font-size:30px;color:#e8b66f;font-weight:700}.muted{color:#a99588;font-size:13px}.tabs{display:flex;gap:8px;margin:28px 0;flex-wrap:wrap}.tabs button,button{background:#e8b66f;border:0;border-radius:999px;padding:10px 15px;font-weight:700;cursor:pointer}.tabs button.alt{background:#33201b;color:#f5e6d4}.table{overflow:auto}.row{display:grid;grid-template-columns:1.5fr .7fr .7fr .8fr 1fr;gap:10px;padding:12px;border-bottom:1px solid #ffffff12;align-items:center;min-width:760px}.reviewrow{grid-template-columns:1fr .5fr 3fr .7fr .7fr}.input{background:#100706;color:white;border:1px solid #ffffff20;padding:9px;border-radius:8px;width:100%}.danger{background:#8e3427;color:#fff}.ok{background:#557f50;color:#fff}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{background:#21100d;border:1px solid #ffffff20;border-radius:18px;padding:25px;width:min(520px,100%)}label{display:block;font-size:12px;color:#bda99c;margin:9px 0 4px}textarea,input,select{width:100%;box-sizing:border-box;background:#100706;color:#fff;border:1px solid #ffffff20;border-radius:8px;padding:10px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="muted">CHOCO KANASU</div><h1>Admin Dashboard</h1></div><a href="/" style="color:#e8b66f">← View Website</a></div>
<div class="grid" id="summary"></div>
<div class="tabs"><button onclick="show('products')">Products & Stock</button><button class="alt" onclick="show('orders')">Orders</button><button class="alt" onclick="show('reviews')">Reviews</button></div>
<div id="content" class="panel"></div>
</div>
<div class="modal" id="productModal"><div class="box"><h2>Add Product</h2><label>Name</label><input id="pn"><label>Description</label><textarea id="pd"></textarea><label>Price</label><input id="pp" type="number"><label>Stock</label><input id="ps" type="number"><label>Category</label><input id="pc"><label>Featured</label><select id="pf"><option value="0">No</option><option value="1">Yes</option></select><br><br><button onclick="addProduct()">Save Product</button> <button class="danger" onclick="closeM()">Cancel</button></div></div>
<script>
async function api(u,o){const r=await fetch(u,o);return r.json()}
async function refreshSummary(){const s=await api("/api/admin/summary");document.getElementById("summary").innerHTML=[["Products",s.products],["Orders",s.orders],["Pending",s.pending],["Sales","₹"+Number(s.sales).toLocaleString("en-IN")],["Low Stock",s.lowStock]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${x[1]}</div></div>`).join("")}
async function show(type){
 const c=document.getElementById("content");
 if(type==="products"){const ps=await api("/api/admin/products");c.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>Products & Stock</h2><button onclick="openM()">+ Add Product</button></div><div class="table">${ps.map(p=>`<div class="row"><div><b>${p.name}</b><div class="muted">${p.category}</div></div><div>₹${p.price}</div><div>${p.stock}</div><div>${p.active?"Active":"Hidden"}</div><div><button onclick="editStock(${p.id},${p.stock})">Stock</button> <button class="danger" onclick="delProduct(${p.id})">Hide</button></div></div>`).join("")}</div>`}
 if(type==="orders"){const os=await api("/api/admin/orders");c.innerHTML=`<h2>Orders</h2><div class="table">${os.map(o=>`<div class="row"><div><b>${o.order_number}</b><div class="muted">${o.customer_name} · ${o.phone}</div></div><div>₹${o.total}</div><div>${o.status}</div><div>${new Date(o.created_at).toLocaleDateString()}</div><div><select onchange="status(${o.id},this.value)">${["Pending","Confirmed","Preparing","Ready","Out for Delivery","Delivered","Cancelled"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></div></div>`).join("")}</div>`}
 if(type==="reviews"){const rs=await api("/api/admin/reviews");c.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>Reviews</h2><button onclick="addReview()">+ Add Review</button></div><div class="table">${rs.map(r=>`<div class="row reviewrow"><div><b>${r.name}</b></div><div>${"★".repeat(r.rating)}</div><div>${r.text}</div><div>${r.approved?"Approved":"Hidden"}</div><div><button onclick="toggleReview(${r.id},${r.approved?0:1})">${r.approved?"Hide":"Approve"}</button> <button class="danger" onclick="deleteReview(${r.id})">Delete</button></div></div>`).join("")}</div>`}
}
async function status(id,v){await api("/api/admin/orders/"+id+"/status",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:v})});refreshSummary()}
function openM(){document.getElementById("productModal").classList.add("open")}function closeM(){document.getElementById("productModal").classList.remove("open")}
async function addProduct(){await api("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:pn.value,description:pd.value,price:pp.value,stock:ps.value,category:pc.value,featured:pf.value==="1"})});closeM();refreshSummary();show("products")}
async function editStock(id,current){const n=prompt("New stock quantity:",current);if(n===null)return;const ps=await api("/api/admin/products");const p=ps.find(x=>x.id===id);p.stock=Number(n);await api("/api/admin/products/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});show("products");refreshSummary()}
async function delProduct(id){if(!confirm("Hide this product?"))return;await api("/api/admin/products/"+id,{method:"DELETE"});show("products");refreshSummary()}
async function addReview(){const name=prompt("Customer name");if(!name)return;const text=prompt("Review text");if(!text)return;await api("/api/admin/reviews",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,rating:5,text})});show("reviews")}
async function toggleReview(id,v){const rs=await api("/api/admin/reviews");const r=rs.find(x=>x.id===id);r.approved=v;await api("/api/admin/reviews/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(r)});show("reviews")}
async function deleteReview(id){if(confirm("Delete review?")){await api("/api/admin/reviews/"+id,{method:"DELETE"});show("reviews")}}
refreshSummary();show("products");
</script></body></html>
